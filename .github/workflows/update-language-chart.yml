name: Update language chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-language-chart.yml"
      - "scripts/update-language-chart.mjs"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  update-language-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Generate language chart
        run: node scripts/update-language-chart.mjs
        env:
          # Use the optional user token for private/collaborative repositories.
          # The script falls back to public owner repositories when it is not
          # configured (or when the token has expired), so scheduled updates
          # keep working without manual intervention.
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          REQUIRE_AUTHENTICATED_REPOS: "false"

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stats.svg
          git diff --cached --quiet || git commit -m "chore: update language chart"
          git push
