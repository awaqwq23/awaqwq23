name: Update language chart

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  update-language-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate language chart
        run: node scripts/update-language-chart.mjs
        env:
          # A user token is required because the automatic GITHUB_TOKEN can
          # only access this workflow's repository.
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          REQUIRE_AUTHENTICATED_REPOS: "true"

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stats.svg
          git diff --cached --quiet || git commit -m "chore: update language chart"
          git push
